<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14121f" />
  <title>Color Create Studio — Life Sim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg:#14121f; --bg2:#1a1729; --panel:#1e1b2e; --panel2:#262238; --line:#322c48;
      --text:#eee7ff; --muted:#a99fc6; --accent:#7cc6ff; --accent2:#e08bff;
      --good:#7cffa0; --pink:#ff8fd0; --gold:#ffd76b;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; }
    body {
      background:radial-gradient(900px 500px at 50% -10%, #241f38, var(--bg));
      color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      display:flex; justify-content:center;
    }
    #app {
      width:100%; max-width:480px; min-height:100vh; background:var(--bg);
      display:flex; flex-direction:column; position:relative; overflow:hidden;
    }
    @media (min-width:520px) {
      body { padding:16px 0; align-items:flex-start; }
      #app { min-height:calc(100vh - 32px); border-radius:26px; border:1px solid var(--line);
        box-shadow:0 30px 80px -30px #000, 0 0 60px -20px #7c4dff33; overflow:hidden; }
    }
    a { color:var(--accent); }
    h2 { font-size:19px; margin:2px 0 10px; background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
    h3 { font-size:14px; margin:0 0 8px; color:var(--text); }
    small { color:var(--muted); }
    .sub { font-size:12.5px; color:var(--muted); line-height:1.5; margin:2px 0 10px; }

    /* ---- status bar ---- */
    #statusbar { padding:10px 14px 8px; background:linear-gradient(180deg,#221d38,#1a1729);
      border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
    .sb-row { display:flex; align-items:center; gap:8px; }
    .sb-id { display:flex; align-items:center; gap:8px; font-size:15px; flex:1; }
    .sb-id .dot { width:13px; height:13px; border-radius:50%; box-shadow:0 0 10px currentColor; }
    .sb-id .lv { font-size:11px; color:var(--bg); background:var(--gold); padding:1px 7px; border-radius:999px; font-weight:700; }
    .sb-menu { margin-left:auto; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 4px; }
    .sb-stats { justify-content:space-between; margin-top:7px; font-size:12px; font-weight:600; color:var(--text); flex-wrap:wrap; gap:6px; }
    .mood-chip { background:#0006; border:1px solid var(--line); padding:2px 9px; border-radius:999px; }

    /* ---- content ---- */
    #content { flex:1; overflow-y:auto; padding:14px 14px 90px; -webkit-overflow-scrolling:touch; }
    section { animation:fade .25s ease; }
    @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

    .card { background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line);
      border-radius:16px; padding:13px; margin-bottom:12px; }
    .obj-h { display:flex; align-items:center; gap:8px; font-size:15px; margin-bottom:8px; }
    .obj-h small { margin-left:auto; text-transform:capitalize; }
    .obj-h .score { margin-left:auto; font-size:11px; color:var(--bg); background:var(--good); padding:2px 8px; border-radius:999px; font-weight:700; }
    .row-h { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; display:flex; align-items:center; gap:8px; }

    .nudge { background:#ff8f6b1a; border:1px solid #ff8f6b40; color:#ffd0be; padding:9px 12px; border-radius:12px; font-size:13px; margin-bottom:10px; }
    .nudge.good { background:#7cffa016; border-color:#7cffa040; color:#c7ffd9; }

    /* action buttons */
    .acts { display:flex; flex-wrap:wrap; gap:7px; }
    .act { background:#0005; border:1px solid var(--line); color:var(--text); border-radius:11px;
      padding:8px 11px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:transform .05s, border-color .2s; }
    .act:hover { border-color:var(--accent); }
    .act:active { transform:scale(.96); }
    .act em { color:var(--muted); font-style:normal; font-size:11px; margin-left:3px; }

    .btn { display:block; width:100%; border:none; border-radius:12px; padding:11px; margin-top:8px; cursor:pointer;
      background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#140f22; font-weight:800; font-size:14px; font-family:inherit; }
    .btn:active { transform:scale(.98); }
    .btn.sm { padding:8px; font-size:13px; }
    .btn.ghost { background:#0004; border:1px solid var(--line); color:var(--text); }

    /* bars */
    .bar { height:8px; background:#0007; border-radius:999px; overflow:hidden; flex:1; }
    .fill { height:100%; border-radius:999px; transition:width .3s; }
    .need { display:flex; align-items:center; gap:9px; margin-bottom:8px; font-size:13px; }
    .need span { width:104px; color:var(--muted); }
    .need em { font-style:normal; width:26px; text-align:right; font-size:12px; color:var(--text); }
    .need.sm span { width:92px; font-size:12px; }
    .xpbar { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .xpbar em { font-style:normal; font-size:11px; color:var(--muted); white-space:nowrap; }

    /* chips */
    .chip { display:inline-flex; align-items:center; gap:4px; background:#0005; border:1px solid var(--line);
      padding:4px 10px; border-radius:999px; font-size:12px; margin:0 4px 4px 0; }
    .chip.big { font-size:14px; padding:6px 12px; background:linear-gradient(90deg,#7c4dff22,#e08bff22); border-color:#7c4dff55; }
    .chips { display:flex; flex-wrap:wrap; margin-top:5px; }

    .sim-head { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    .avatar { width:56px; height:56px; border-radius:16px; display:grid; place-items:center; font-size:28px;
      box-shadow:0 0 22px -4px currentColor; flex:none; }
    .mini { background:#0005; border:1px solid var(--line); color:var(--text); border-radius:8px; font-size:11px; padding:2px 7px; cursor:pointer; }

    /* worlds */
    .world.locked { opacity:.72; }
    .world .lock { margin-left:auto; }
    .req { background:#0006; border:1px dashed var(--line); border-radius:10px; padding:8px 11px; font-size:12.5px; color:var(--gold); }

    /* career ladder */
    .ladder { margin-top:10px; display:flex; flex-direction:column; gap:4px; }
    .tier { font-size:12px; color:var(--muted); padding:5px 9px; border-radius:8px; background:#0004; display:flex; }
    .tier em { font-style:normal; margin-left:auto; }
    .tier.on { color:var(--text); background:linear-gradient(90deg,#7cffa022,#7cc6ff22); border:1px solid #7cffa044; }
    .tier.done { color:#7cffa0; }

    /* npc / relationships */
    .rel { display:flex; align-items:center; gap:9px; margin-bottom:6px; font-size:12px; }
    .rel span { width:96px; color:var(--muted); }
    .rel em { font-style:normal; width:26px; text-align:right; }
    .mem { font-style:italic; margin-top:6px; }

    /* quests */
    .q-h { display:flex; align-items:center; gap:8px; }
    .q-h .tag { margin-left:auto; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent2); background:#e08bff1a; padding:2px 8px; border-radius:999px; }
    .objs { list-style:none; padding:0; margin:6px 0; font-size:13px; }
    .objs li { padding:3px 0; color:var(--muted); }
    .objs li.ok { color:var(--good); }
    .reward { font-size:11.5px; color:var(--gold); margin-top:4px; }
    .quest.done { opacity:.6; }
    .done-h { margin:16px 0 8px; color:var(--muted); font-size:13px; }

    /* feed */
    .feed-item { display:flex; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13px; }
    .feed-item .fi { font-size:18px; flex:none; }
    .feed-item small { display:block; margin-top:2px; }

    .classic-link { display:block; text-align:center; margin:8px 0 4px; font-size:12px; color:var(--muted); }

    /* ---- tab bar ---- */
    #tabnav { position:sticky; bottom:0; display:flex; background:linear-gradient(0deg,#1c1830,#191527ee);
      border-top:1px solid var(--line); z-index:20; backdrop-filter:blur(8px); padding:4px 2px env(safe-area-inset-bottom); }
    .tabbtn { flex:1; background:none; border:none; color:var(--muted); cursor:pointer; padding:7px 0 6px;
      display:flex; flex-direction:column; align-items:center; gap:2px; font-family:inherit; }
    .tabbtn span { font-size:19px; filter:grayscale(.4); transition:transform .1s; }
    .tabbtn label { font-size:9px; cursor:pointer; }
    .tabbtn.on { color:var(--text); }
    .tabbtn.on span { filter:none; transform:translateY(-1px) scale(1.12); }

    /* ---- modal ---- */
    .overlay { position:fixed; inset:0; background:#0a0812cc; display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fade .2s; }
    @media (min-width:520px){ .overlay{ align-items:center; } }
    .sheet { width:100%; max-width:460px; max-height:86vh; overflow-y:auto; background:linear-gradient(180deg,var(--panel),var(--bg2));
      border:1px solid var(--line); border-radius:22px 22px 0 0; padding:18px 16px 22px; animation:slideUp .25s ease; }
    @media (min-width:520px){ .sheet{ border-radius:22px; } }
    @keyframes slideUp { from{transform:translateY(30px); opacity:.6} to{transform:none; opacity:1} }
    .fld { display:block; font-size:12px; color:var(--muted); margin-bottom:12px; }
    .fld input { display:block; width:100%; margin-top:5px; background:#0006; border:1px solid var(--line); color:var(--text);
      border-radius:10px; padding:10px; font-size:15px; font-family:inherit; }
    .picks { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
    .picks.scroll { max-height:52vh; overflow-y:auto; }
    .pick { flex:1 1 46%; text-align:left; background:#0005; border:1px solid var(--line); color:var(--text);
      border-radius:13px; padding:11px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; }
    .pick small { display:block; font-weight:400; color:var(--muted); margin-top:3px; font-size:11.5px; }
    .pick.on { border-color:var(--accent2); background:linear-gradient(180deg,#e08bff22,#7c4dff18); }
    .pick.dis { opacity:.5; cursor:default; }

    /* ---- toasts ---- */
    #toasts { position:fixed; left:50%; bottom:78px; transform:translateX(-50%); z-index:60;
      display:flex; flex-direction:column; gap:7px; align-items:center; pointer-events:none; width:100%; max-width:440px; padding:0 12px; }
    .toast { background:#241d3aee; border:1px solid var(--line); color:var(--text); padding:9px 15px; border-radius:999px;
      font-size:13px; font-weight:600; opacity:0; transform:translateY(10px); transition:all .25s; box-shadow:0 12px 30px -12px #000; max-width:100%; text-align:center; }
    .toast.show { opacity:1; transform:none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Core namespace (shared with classic mode) -->
  <script src="src/core.js"></script>
  <!-- Data tables -->
  <script src="src/sim/state.js"></script>
  <script src="src/sim/data-worlds.js"></script>
  <script src="src/sim/data-careers.js"></script>
  <script src="src/sim/data-npcs.js"></script>
  <script src="src/sim/data-objects.js"></script>
  <script src="src/sim/data-quests.js"></script>
  <script src="src/sim/data-events-packs.js"></script>
  <!-- Systems -->
  <script src="src/sim/time.js"></script>
  <script src="src/sim/needs-mood.js"></script>
  <script src="src/sim/engine.js"></script>
  <script src="src/sim/quests.js"></script>
  <script src="src/sim/npc.js"></script>
  <script src="src/sim/progression.js"></script>
  <script src="src/sim/save.js"></script>
  <!-- UI + boot -->
  <script src="src/sim/ui.js"></script>
  <script src="src/sim/boot.js"></script>
</body>
</html>
